<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuatro Venezolano Interactivo - SEA 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Quicksand:wght@500;700&display=swap');

        :root { 
            --gold: #d4af37; 
            --blue-panel: rgba(30, 50, 80, 0.75); 
        }

        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Cabecera */
        .header-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 75px;
            background: rgba(255, 255, 255, 0.95);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; box-sizing: border-box;
            border-bottom: 3px solid var(--gold); z-index: 100;
        }

        .header-logo { height: 50px; width: auto; }
        .header-center h1 { margin: 0; font-family: 'Bungee', cursive; font-size: 1.3rem; color: #333; }

        /* Contenedor del Modelo 3D */
        #canvas-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
        }
        #canvas-container iframe { width: 100%; height: 100%; border: none; }

        /* CONSOLA DE SONIDO (Inferior, no invasiva) */
        .music-console {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--blue-panel);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 2px solid var(--gold);
            padding: 15px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .label-style {
            font-family: 'Bungee', cursive;
            font-size: 0.75rem;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .string-btn {
            width: 55px; height: 55px;
            background: radial-gradient(circle, #222 0%, #050505 100%);
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Bungee', cursive; font-size: 0.7rem; color: var(--gold);
        }

        .string-btn:hover { border-color: var(--gold); transform: scale(1.1); }
        .string-btn:active { transform: scale(0.9); background: var(--gold); color: #000; }

        .chord-btn {
            background: linear-gradient(135deg, #4a331a 0%, #2a1a0a 100%);
            border-radius: 12px;
            width: auto;
            padding: 0 15px;
            height: 40px;
        }

        #loader {
            position: fixed; inset: 0; background: #0a0a0a;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; color: var(--gold); font-family: 'Bungee', cursive;
        }
    </style>
</head>
<body>

<div id="loader">CARGANDO SONIDO VIRTUAL...</div>

<header class="header-ui">
    <img src="logo2.jpg" class="header-logo" alt="Logo">
    <div class="header-center"><h1>ACADEMIA DEL CUATRO</h1></div>
    <img src="logo_header.png" class="header-logo" alt="SEA">
</header>

<div id="canvas-container">
    <iframe title="Cuatro venezolano" src="https://sketchfab.com/models/23b7d04639874ef08e55c7a683a89e0d/embed?autostart=1&ui_theme=dark&dnt=1"></iframe>
</div>

<div class="music-console">
    <div class="label-style">CUERDAS AL AIRE</div>
    <div class="btn-group">
        <button class="string-btn" onmousedown="playCuatroNote(440.00)">LA</button>
        <button class="string-btn" onmousedown="playCuatroNote(293.66)">RE</button>
        <button class="string-btn" onmousedown="playCuatroNote(369.99)">FA#</button>
        <button class="string-btn" onmousedown="playCuatroNote(246.94)">SI</button>
    </div>
    
    <div class="label-style" style="margin-top:5px">ACORDES (RASGUEO)</div>
    <div class="btn-group">
        <button class="string-btn chord-btn" onmousedown="playChord('D')">RE M</button>
        <button class="string-btn chord-btn" onmousedown="playChord('A7')">LA 7</button>
        <button class="string-btn chord-btn" onmousedown="playChord('G')">SOL M</button>
    </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

/** * SÍNTESIS TÉCNICA: Simulamos el "pluck" de la cuerda y la madera
 * Usamos una combinación de Triangle (cuerpo) y Sawtooth filtrado (brillo de nylon)
 */
function playCuatroNote(freq, delay = 0) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const now = audioCtx.currentTime + delay;
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    // Oscilador 1: El cuerpo de la nota
    const osc1 = audioCtx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(freq, now);

    // Oscilador 2: El brillo metálico/nylon
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sawtooth';
    osc2.frequency.setValueAtTime(freq, now);
    const osc2Gain = audioCtx.createGain();
    osc2Gain.gain.setValueAtTime(0.05, now); // Volumen bajo para el brillo

    // Filtro para simular la madera (apaga los agudos rápido)
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(2500, now);
    filter.frequency.exponentialRampToValueAtTime(100, now + 1.0);

    // Envolvente de volumen
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.4, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

    osc1.connect(filter);
    osc2.connect(osc2Gain);
    osc2Gain.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 1.6);
    osc2.stop(now + 1.6);
}

function playChord(type) {
    const chords = {
        'D': [293.66, 440.00, 587.33, 369.99],
        'A7': [440.00, 277.18, 392.00, 329.63],
        'G': [392.00, 293.66, 493.88, 392.00]
    };
    // El rasgueo venezolano tiene un ligero retraso entre cuerdas
    chords[type].forEach((f, i) => playCuatroNote(f, i * 0.04));
}

window.onload = () => {
    setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 2000);
};
</script>
</body>
</html>
