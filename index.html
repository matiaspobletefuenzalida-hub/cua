<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuatro Venezolano - SEA 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Quicksand:wght@500;700&display=swap');

        :root { --gold: #d4af37; }

        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Cabecera Institucional */
        .header-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            border-bottom: 4px solid var(--gold);
            z-index: 100;
        }

        .header-logo { height: 65px; width: auto; object-fit: contain; }
        .header-center { text-align: center; color: #222; }
        .header-center h1 { margin: 0; font-family: 'Bungee', cursive; font-size: 1.6rem; line-height: 1; color: #333; }
        .header-center p { margin: 5px 0 0 0; font-weight: 700; color: #555; font-size: 0.75rem; letter-spacing: 1px; }

        /* Panel de Información y Datos Curiosos */
        .info-panel {
            position: absolute;
            top: 110px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border-left: 4px solid var(--gold);
            border-radius: 4px;
            padding: 20px;
            backdrop-filter: blur(10px);
            z-index: 90;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .info-panel h2 { 
            font-family: 'Bungee', cursive; 
            font-size: 0.8rem; 
            color: var(--gold); 
            margin: 0 0 12px 0; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #fact-content {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #efefef;
            min-height: 100px;
            transition: opacity 0.4s ease;
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: #333;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            height: 100%;
            background: var(--gold);
            width: 0%;
            animation: progressAnim 8s linear infinite;
        }

        @keyframes progressAnim {
            from { width: 0%; }
            to { width: 100%; }
        }

        #canvas-container { flex-grow: 1; outline: none; }

        /* Controles Inferiores */
        .footer-ui {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
        }

        .btn-play {
            background: linear-gradient(135deg, #b57a3d 0%, #8b4513 100%);
            color: white;
            padding: 16px 40px;
            border-radius: 40px;
            font-family: 'Bungee', cursive;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-play:hover { 
            transform: translateY(-5px) scale(1.05); 
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4);
            border-color: var(--gold);
        }

        .hint { 
            margin-top: 12px;
            font-size: 0.65rem; 
            color: #aaa; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 10px;
        }

        #loader {
            position: fixed; inset: 0; background: #0a0a0a;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; color: var(--gold); font-family: 'Bungee', cursive;
        }
    </style>
</head>
<body>

<div id="loader">CARGANDO EXPERIENCIA...</div>

<header class="header-ui">
    <!-- Membrete Izquierdo -->
    <img src="logo2.jpg" class="header-logo" alt="Escuela Santa Eugenia" onerror="this.style.opacity='0'">
    
    <div class="header-center">
        <h1>CUATRO VENEZOLANO</h1>
        <p>Patrimonio Cultural • SEA 2026</p>
    </div>
    
    <!-- Membrete Derecho -->
    <img src="logo_header.png" class="header-logo" alt="SEA" onerror="this.style.opacity='0'">
</header>

<div class="info-panel">
    <h2><span style="font-size:1.2rem">💡</span> DATOS CURIOSOS</h2>
    <div id="fact-content">El Cuatro es el instrumento nacional de Venezuela, descendiente de la guitarra renacentista del siglo XVI.</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
</div>

<div id="canvas-container"></div>

<div class="footer-ui">
    <button class="btn-play" onclick="playArpeggio()">TOCAR ARPEGIO SUAVE</button>
    <div class="hint">Interactúa con el Cuatro para explorarlo</div>
</div>

<script>
/** DATOS DEL INSTRUMENTO **/
const infoFacts = [
    "Afinación: A diferencia de otros instrumentos, la cuerda superior (La) es más aguda que la segunda (Re).",
    "El Golpeador: Esa madera oscura en la parte superior protege la tapa de los rasgueos percusivos constantes.",
    "Madera de Concierto: Los mejores cuatros usan Cedro Amargo para el mástil y Pino Abeto para la tapa armónica.",
    "Patrimonio: En 2013, fue declarado Bien de Interés Cultural por ser el alma de la música llanera.",
    "El Cambur Pintón: Es la onomatopeya rítmica que define su afinación básica (La-Re-Fa#-Si).",
    "Versatilidad: Aunque es rural en origen, hoy se usa en jazz, música clásica y pop experimental."
];

let factIdx = 0;
function rotateFacts() {
    const el = document.getElementById('fact-content');
    el.style.opacity = 0;
    setTimeout(() => {
        factIdx = (factIdx + 1) % infoFacts.length;
        el.innerText = infoFacts[factIdx];
        el.style.opacity = 1;
    }, 400);
}
setInterval(rotateFacts, 8000);

/** AUDIO: ARPEGIO DELICADO **/
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playArpeggio() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = [440.00, 293.66, 369.99, 493.88]; 
    notes.forEach((freq, i) => {
        const startTime = audioCtx.currentTime + (i * 0.18);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.15, startTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + 2.0);
    });
}

/** MOTOR 3D **/
let scene, camera, renderer, controls, instrumentGroup;

function init() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();
    
    camera = new THREE.PerspectiveCamera(35, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(10, 5, 12);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const topLight = new THREE.DirectionalLight(0xffffff, 0.8);
    topLight.position.set(5, 10, 5);
    scene.add(topLight);

    instrumentGroup = new THREE.Group();

    const woodBody = new THREE.MeshStandardMaterial({ color: 0x633517, roughness: 0.3, metalness: 0.05 });
    const woodTop = new THREE.MeshStandardMaterial({ color: 0xedc9a1, roughness: 0.4 });
    const woodDark = new THREE.MeshStandardMaterial({ color: 0x3d1f0d, roughness: 0.2 });
    const ebony = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

    // GEOMETRÍA ORIGINAL RESTAURADA
    const shape = new THREE.Shape();
    shape.moveTo(0, 1.8);
    shape.bezierCurveTo(1.4, 1.8, 1.4, 0.5, 0.6, 0.2);
    shape.bezierCurveTo(1.6, -0.2, 1.6, -2.4, 0, -2.4);
    shape.bezierCurveTo(-1.6, -2.4, -1.6, -0.2, -0.6, 0.2);
    shape.bezierCurveTo(-1.4, 0.5, -1.4, 1.8, 0, 1.8);

    const extrudeSettings = { depth: 0.7, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05 };
    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, extrudeSettings), woodBody);
    body.rotation.x = Math.PI / 2;
    body.castShadow = true;
    instrumentGroup.add(body);

    const topWrap = new THREE.Group();
    topWrap.position.z = 0.71; 
    body.add(topWrap);

    topWrap.add(new THREE.Mesh(new THREE.ShapeGeometry(shape), woodTop));

    const pickguardShape = new THREE.Shape();
    pickguardShape.moveTo(0, 1.8);
    pickguardShape.bezierCurveTo(1.4, 1.8, 1.4, 0.5, 0.5, 0.1);
    pickguardShape.lineTo(-0.5, 0.1);
    pickguardShape.bezierCurveTo(-1.4, 0.5, -1.4, 1.8, 0, 1.8);
    const pickguard = new THREE.Mesh(new THREE.ShapeGeometry(pickguardShape), woodDark);
    pickguard.position.z = 0.005;
    topWrap.add(pickguard);

    const hole = new THREE.Mesh(new THREE.CircleGeometry(0.35, 32), new THREE.MeshBasicMaterial({color: 0x000000}));
    hole.position.set(0, 0.6, 0.01);
    topWrap.add(hole);

    const bridge = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 0.1), ebony);
    bridge.position.set(0, -1.4, 0.05);
    topWrap.add(bridge);

    const neck = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3.8, 0.35), woodBody);
    neck.position.set(0, 3.3, 0.35);
    body.add(neck);

    const fretboard = new THREE.Mesh(new THREE.BoxGeometry(0.62, 3.8, 0.06), ebony);
    fretboard.position.z = 0.2;
    neck.add(fretboard);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.2, 0.2), woodBody);
    head.position.set(0, 2.3, 0.1);
    head.rotation.x = -0.15;
    neck.add(head);

    // ETIQUETA VENEZUELA 3D
    const labelGroup = new THREE.Group();
    const createLetter = (x) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.4, 0.1), woodDark);
        m.position.x = x;
        labelGroup.add(m);
    };
    for(let i=-4; i<=4; i++) createLetter(i*0.3);
    labelGroup.position.set(0, -3.2, 0);
    body.add(labelGroup);

    // CUERDAS
    const stringMat = new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
    for(let i=0; i<4; i++) {
        const x = -0.21 + (i * 0.14);
        const curve = new THREE.LineCurve3(new THREE.Vector3(x, -1.4, 0.12), new THREE.Vector3(x, 4.8, 0.35));
        topWrap.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 2, 0.01, 8), stringMat));
    }

    scene.add(instrumentGroup);
    document.getElementById('loader').style.display = 'none';
    animate();
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const container = document.getElementById('canvas-container');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

init();
</script>
</body>
</html>
